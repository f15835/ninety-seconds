[package]
name = "sim-core"
version.workspace = true
edition.workspace = true
description = "90 秒：确定性模拟内核。固定 20Hz tick，禁用浮点。"

[dependencies]
# 刻意为空。见 workspace Cargo.toml 里的说明。
